<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Soundboard</title>
<foreignObject x="0" y="0" width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml" class="app">
<style><![CDATA[
.app{--bg:#E8EBF2;--ink:#151827;color-scheme:light;box-sizing:border-box;width:100%;height:100%;overflow:auto;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
@media (prefers-color-scheme:dark){.app{--bg:#171A29;--ink:#EEF0F7;color-scheme:dark}}
.app *{box-sizing:border-box}
main{max-width:960px;margin:0 auto;padding:28px 20px 48px}
h1{margin:0 0 24px;font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1}
.hit:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.pad{display:flex;flex-direction:column;gap:12px}
.hit{position:relative;overflow:hidden;width:100%;min-height:clamp(160px,26vh,240px);border:0;border-radius:28px;background:var(--c);color:var(--on);display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:20px 22px;cursor:pointer;text-align:left;font:inherit;transition:transform .08s}
.hit::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:var(--d);transition:height .25s linear}
.hit>*{position:relative}
.hit:active{transform:scale(.98)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:500}
kbd{font:inherit;font-size:.85rem;border:1.5px solid currentColor;border-radius:8px;padding:0 8px;opacity:.75}
.name{display:block;font-size:clamp(2.4rem,8vw,3.8rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.time{display:block;margin-top:8px;font-variant-numeric:tabular-nums;opacity:.9}
.seek{width:100%;margin:0;accent-color:var(--c);cursor:pointer}
]]></style>
<main>
  <h1>Soundboard</h1>
  <section id="grid"></section>
</main>
<script><![CDATA[
const X = 'http://www.w3.org/1999/xhtml';
const clips = [
  {name:'Leo',    c:'#2F4BFF', d:'#1B2FB8', on:'#FFFFFF', src:'https://audio.jukehost.co.uk/01a16ad7-1b4a-7329-a3a4-b24c0a0bde7c'},
  {name:'Amar',   c:'#D6246E', d:'#9A1450', on:'#FFFFFF', src:'https://audio.jukehost.co.uk/01a16ad7-1c11-7149-96ad-fcde56791d83'},
  {name:'Noah',   c:'#0E9F8C', d:'#096B5E', on:'#FFFFFF', src:'https://audio.jukehost.co.uk/01a16ad7-1c44-7086-be01-3ed8538e834a'},
  {name:'Faizan', c:'#F2B01E', d:'#C98A00', on:'#1A1400', src:'https://audio.jukehost.co.uk/01a16ad7-1c1e-71c6-99d2-d3e2fed4b000'}
];

const grid = document.querySelector('#grid');
const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const h = (tag, cls, txt, parent) => {
  const e = document.createElementNS(X, tag);
  if (cls) e.setAttribute('class', cls);
  if (txt != null) e.textContent = txt;
  if (parent) parent.appendChild(e);
  return e;
};

clips.forEach((c, i) => {
  const a = new Audio(c.src);
  a.preload = 'metadata';
  c.a = a;

  const el = h('article', 'pad', null, grid);
  el.setAttribute('style', '--c:' + c.c + ';--d:' + c.d + ';--on:' + c.on);
  const hit = h('button', 'hit', null, el);
  hit.setAttribute('type', 'button');
  const top = h('span', 'top', null, hit);
  const state = h('span', 'state', 'Play', top);
  h('kbd', null, String(i + 1), top);
  const txt = h('span', null, null, hit);
  h('span', 'name', c.name, txt);
  const time = h('span', 'time', 'Loading', txt);
  const seek = h('input', 'seek', null, el);
  seek.setAttribute('type', 'range');
  seek.setAttribute('min', '0');
  seek.setAttribute('max', '1000');
  seek.setAttribute('value', '0');
  seek.setAttribute('aria-label', 'Seek ' + c.name);

  const draw = () => {
    const p = a.duration ? a.currentTime / a.duration : 0;
    hit.style.setProperty('--p', p);
    seek.value = Math.round(p * 1000);
    time.textContent = a.currentTime > 0 ? fmt(a.currentTime) + ' of ' + fmt(a.duration) : fmt(a.duration);
  };
  const label = () => {
    state.textContent = a.paused ? (a.currentTime > 0 ? 'Paused' : 'Play') : 'Playing';
    hit.setAttribute('aria-label', (a.paused ? 'Play ' : 'Pause ') + c.name);
  };

  a.addEventListener('loadedmetadata', draw);
  a.addEventListener('timeupdate', draw);
  a.addEventListener('play', label);
  a.addEventListener('pause', label);
  a.addEventListener('ended', () => { a.currentTime = 0; draw(); label(); });
  a.addEventListener('error', () => { time.textContent = 'Could not load this sound'; });

  hit.addEventListener('click', () => toggle(i));
  seek.addEventListener('input', () => {
    if (a.duration) { a.currentTime = seek.value / 1000 * a.duration; draw(); }
  });
  label();
});

function toggle(i) {
  const a = clips[i].a;
  if (a.paused) {
    clips.forEach((c, j) => { if (j !== i) c.a.pause(); });
    a.play().catch(() => {});
  } else {
    a.pause();
  }
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= clips.length) { e.preventDefault(); toggle(n - 1); }
});
]]></script>
</div>
</foreignObject>
</svg>
